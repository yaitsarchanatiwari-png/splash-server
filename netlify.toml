# Netlify Configuration for Splash Frontend
# Backend API runs on Render -> all /api/*, /auth/*, and /download/* calls are proxied there

[build]
  base    = "."
  publish = "wwwroot"

# Proxy all backend API calls to Render (transparent, same-origin feel)
[[redirects]]
  from   = "/api/*"
  to     = "https://splash-macro-app.onrender.com/api/:splat"
  status = 200
  force  = true

[[redirects]]
  from   = "/auth/*"
  to     = "https://splash-macro-app.onrender.com/auth/:splat"
  status = 200
  force  = true

[[redirects]]
  from   = "/download/*"
  to     = "https://splash-macro-app.onrender.com/download/:splat"
  status = 200
  force  = true

# Portal SPA
[[redirects]]
  from   = "/portal"
  to     = "/portal/index.html"
  status = 200

# Catch-all fallback
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
